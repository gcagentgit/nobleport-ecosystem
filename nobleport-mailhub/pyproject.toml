[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobleport-mailhub"
version = "1.0.0"
description = "Every mailbox in one place: Gmail, Microsoft 365, Yahoo, iCloud, Zoho, GoDaddy and any IMAP/SMTP account, unified on Linux with Python."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.28",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
mailhub = "mailhub.cli:main"

[tool.setuptools.packages.find]
include = ["mailhub*"]

[tool.setuptools.package-data]
mailhub = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
