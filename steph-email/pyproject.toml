[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steph-email-engine"
version = "0.1.0"
description = "NoblePort Construction email operations with expected-mail tracking"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1.3,<4", "PyYAML>=6.0.3,<7", "cryptography>=46,<51", "imapclient>=3,<5", "requests>=2.32.4,<3", "waitress>=3.0.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
steph-email = "steph_email.__main__:main"

[tool.setuptools.packages.find]
include = ["steph_email*"]

[tool.setuptools.package-data]
steph_email = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
