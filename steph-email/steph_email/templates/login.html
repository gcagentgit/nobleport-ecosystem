<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Steph Email</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">S<span>●</span></div>
    <p class="eyebrow">NOBLEPORT CONSTRUCTION LLC</p>
    <h1>Your inbox.<br>Your command center.</h1>
    <p class="muted">Sign in to Steph to review incoming mail, track replies, and keep the next move clear.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label for="token">Dashboard access key</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary full">Open command center <span aria-hidden="true">→</span></button>
    </form>
    <p class="micro">Use the access key from your local setup. Mailbox passwords do not belong here.</p>
  </main>
</body>
</html>
